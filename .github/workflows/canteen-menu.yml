name: Canteen menu

# Runs every weekday morning. The script decides what to post:
#   - the daily menu on every weekday
#   - additionally, on Fridays, the full coming-week menu
#
# Cron is in UTC. 06:17 UTC = 08:17 in Copenhagen during summer (CEST) and
# 07:17 during winter (CET). Adjust the hour if you want a different local time;
# note that a fixed UTC cron drifts by one hour across daylight-saving changes.
#
# We deliberately avoid the top of the hour ("0 6"): GitHub's scheduled runs are
# best-effort and the on-the-hour slots are the most congested — they get delayed
# by many minutes and are sometimes dropped entirely. An odd minute is far more
# reliable. Even so, expect the occasional few-minute delay.
on:
  schedule:
    - cron: "17 7 * * 1-5"
  workflow_dispatch: # allows manual "Run workflow" from the Actions tab

jobs:
  post-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run post
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          FOODPLACE_LOCATION_ID: ${{ vars.FOODPLACE_LOCATION_ID || '1' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Copenhagen' }}
          DAILY_STATIONS: ${{ vars.DAILY_STATIONS || 'Go Green,Meal 1,Comfort Food' }}
          TREATS_STATION: ${{ vars.TREATS_STATION || 'Treats' }}
          STATION_LABELS: ${{ vars.STATION_LABELS || 'Meal 1=The Deli' }}
