name: Canteen menu

# Triggered externally, not by GitHub's own cron. GitHub's scheduled runs are
# best-effort and unreliable, so we drive this from Google Cloud Scheduler, which
# POSTs to the workflow_dispatch API on a real, timezone-aware schedule. The
# script decides what to post:
#   - the daily menu on every weekday
#   - additionally, on Fridays, the full coming-week menu
#
# The weekday/Friday logic and timezone live in the code and in the Cloud
# Scheduler job (Europe/Copenhagen), so there is nothing time-related here.
on:
  workflow_dispatch: # triggered by Cloud Scheduler (and the manual "Run workflow" button)

jobs:
  post-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run post
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          FOODPLACE_LOCATION_ID: ${{ vars.FOODPLACE_LOCATION_ID || '1' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Copenhagen' }}
          DAILY_STATIONS: ${{ vars.DAILY_STATIONS || 'Go Green,Meal 1,Comfort Food' }}
          TREATS_STATION: ${{ vars.TREATS_STATION || 'Treats' }}
          STATION_LABELS: ${{ vars.STATION_LABELS || 'Meal 1=The Deli' }}
